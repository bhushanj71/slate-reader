# Slate runs entirely in the browser and pdf.js is committed under
# public/vendor, so the published folder needs nothing built. Point a static
# host at public/ and it works.
#
# The Express server in server.js serves the same folder and adds a health
# check; it can be deployed as a Node web service instead — see the README.

services:
  - type: web
    name: slate-reader
    runtime: static
    buildCommand: echo "No build step - public/ is ready to publish."
    staticPublishPath: ./public
