# A Node web service, because the studio voice needs somewhere to keep the
# ElevenLabs key. The key is NEVER committed: set ELEVENLABS_API_KEY in the
# Render dashboard, or in the service's Environment tab.
#
# Slate also runs as a plain static site with no server at all — pdf.js is
# committed under public/vendor, so publishing that folder is enough. You lose
# the studio voice and fall back to the browser's own voices. See the README.

services:
  - type: web
    name: slate-reader
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        sync: false            # set in the dashboard; never stored in this file
      - key: ELEVENLABS_DAILY_LIMIT
        value: "150000"
